appId: dev.orbyte.app
productName: Orbyte
directories:
  output: dist
  buildResources: build
files:
  - out/**
  - package.json
# Migrations are read from process.resourcesPath/drizzle when packaged (src/main/index.ts).
extraResources:
  - from: drizzle
    to: drizzle
# Native modules and the Agent SDK's bundled `claude` binary cannot run from inside an asar.
asarUnpack:
  - "**/node_modules/node-pty/**"
  - "**/node_modules/better-sqlite3/**"
  - "**/node_modules/@anthropic-ai/claude-agent-sdk*/**"
npmRebuild: true
mac:
  artifactName: ${productName}-${version}-${arch}.${ext}
  category: public.app-category.developer-tools
  icon: build/icon.icns
  target: [dmg, zip]
  # Unsigned for now: no Apple Developer ID yet (see docs/SECURITY.md). macOS shows a Gatekeeper warning.
  identity: null
  hardenedRuntime: false
