name: Release

# Every push to main that changes more than docs is checked, packaged and published as a GitHub pre-release.
# Version = MAJOR.MINOR from package.json + the workflow run number as the patch (no version-bump commits).
on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '.claude/**'

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test

  package:
    needs: check
    strategy:
      fail-fast: true
      matrix:
        include:
          - runner: macos-latest   # Apple silicon
            arch: arm64
          - runner: macos-15-intel # Intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Compute version
        id: v
        run: |
          base=$(node -p "require('./package.json').version.split('.').slice(0,2).join('.')")
          echo "version=${base}.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
      - name: Package (unsigned)
        run: |
          pnpm exec electron-vite build
          pnpm exec electron-builder --mac --${{ matrix.arch }} --publish never -c.extraMetadata.version=${{ steps.v.outputs.version }}
      - uses: actions/upload-artifact@v4
        with:
          name: orbyte-${{ matrix.arch }}
          path: |
            dist/*.dmg
            dist/*.zip
          if-no-files-found: error

  release:
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compute version
        id: v
        run: |
          base=$(node -p "require('./package.json').version.split('.').slice(0,2).join('.')")
          echo "version=${base}.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Checksums
        run: cd artifacts && shasum -a 256 * > SHA256SUMS.txt
      - name: Publish pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.v.outputs.version }}" artifacts/* \
            --target "$GITHUB_SHA" --prerelease --generate-notes \
            --title "Orbyte ${{ steps.v.outputs.version }} (unsigned)" \
            --notes "Unsigned macOS build: macOS will warn on first open (right-click, Open). See docs/SECURITY.md."
